});

window.addEventListener('keydown', function (e) {
  if (e.code === 'Escape') {
    if (state === ST.FOCUS) resetView();
    else if (state === ST.SOLAR) returnToGalaxy();
  } else if (e.code === 'Space') {
    e.preventDefault();
    togglePause();
  } else if (e.key === '+' || e.key === '=') {
    setSpeed(timeScale >= 100 ? 100 : (timeScale >= 10 ? 100 : 10));
  } else if (e.key === '-' || e.key === '_') {
    setSpeed(timeScale <= 1 ? 1 : (timeScale <= 10 ? 1 : 10));
  }
});

/* ==========================================================================
 *  19.  渲染
 * ========================================================================== */

var projMat = M4.create();
var viewMat = M4.create();

var dpr = 1;
var pixelRatioUniform = 1;

var UP_Y = [0, 1, 0];
var UP_Z = [0, 0, 1];

function resize() {
  screenW = window.innerWidth;
  screenH = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  pixelRatioUniform = dpr;

  canvas.width  = Math.max(1, Math.floor(screenW * dpr));
  canvas.height = Math.max(1, Math.floor(screenH * dpr));
  canvas.style.width  = screenW + 'px';
  canvas.style.height = screenH + 'px';

  gl.viewport(0, 0, canvas.width, canvas.height);
  M4.perspective(projMat, CFG.camera.fov, screenW / screenH,
                 CFG.camera.near, CFG.camera.far);
}
window.addEventListener('resize', resize);

/* ---- 19.1 背景星空 ---- */
function drawBackgroundStars(time) {
  var P = progParticle;
  gl.useProgram(P.program);

  gl.uniformMatrix4fv(P.uniforms.uProj, false, projMat);
  gl.uniformMatrix4fv(P.uniforms.uView, false, viewMat);
  gl.uniformMatrix4fv(P.uniforms.uModel, false, IDENTITY_MAT);
  gl.uniform1f(P.uniforms.uPixelRatio, pixelRatioUniform);
  gl.uniform1f(P.uniforms.uAtten, 0);
  gl.uniform1f(P.uniforms.uFixedSize, 1.5);
  gl.uniform1f(P.uniforms.uTime, time);
  gl.uniform1f(P.uniforms.uOpacity, 0.62);

  bindAttrib(P, 'aPos',   bgBuffers.pos, 3);
  bindAttrib(P, 'aColor', bgBuffers.col, 3);
  bindAttrib(P, 'aSize',  bgBuffers.siz, 1);
  bindAttrib(P, 'aSeed',  bgBuffers.sed, 1);

  gl.drawArrays(gl.POINTS, 0, bgData.count);
}

/* ---- 19.2 银河层 ---- */
function drawGalaxyLayer(time) {
  var alpha = layerAlpha.galaxy;
  if (alpha < 0.004) return;

  gl.enable(gl.BLEND);
  gl.blendEquation(gl.FUNC_ADD);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);

  /* ---- 盘面贴图：连续光度打底 ---- */
  if (galaxyTex) {
    var T = progGalaxyTex;
    gl.useProgram(T.program);
    gl.uniformMatrix4fv(T.uniforms.uProj, false, projMat);
    gl.uniformMatrix4fv(T.uniforms.uView, false, viewMat);
    gl.uniformMatrix4fv(T.uniforms.uModel, false, galaxyModel);
    gl.uniform1f(T.uniforms.uExtent, CFG.galaxy.radius * 1.06);
    gl.uniform1f(T.uniforms.uOpacity, alpha * 0.92);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, galaxyTex);
    gl.uniform1i(T.uniforms.uTex, 0);

    bindAttrib(T, 'aQuad', quadBuffer, 2);
    gl.drawArrays(gl.TRIANGLES, 0, 6);
  }

  var P = progParticle;
  gl.useProgram(P.program);

  gl.uniformMatrix4fv(P.uniforms.uProj, false, projMat);
  gl.uniformMatrix4fv(P.uniforms.uView, false, viewMat);
  gl.uniformMatrix4fv(P.uniforms.uModel, false, galaxyModel);
  gl.uniform1f(P.uniforms.uPixelRatio, pixelRatioUniform);
  gl.uniform1f(P.uniforms.uAtten, CFG.galaxy.atten);
  gl.uniform1f(P.uniforms.uFixedSize, 0);
  gl.uniform1f(P.uniforms.uTime, time);
  // 粒子层只负责「星点闪烁」：盘面的连续光度已经由贴图承担，
  // 这里再堆高亮度只会把图像重新糊成一团白。
  gl.uniform1f(P.uniforms.uOpacity, alpha * 0.80);

  bindAttrib(P, 'aPos',   galaxyBuffers.pos, 3);
  bindAttrib(P, 'aColor', galaxyBuffers.col, 3);
  bindAttrib(P, 'aSize',  galaxyBuffers.siz, 1);
  bindAttrib(P, 'aSeed',  galaxyBuffers.sed, 1);

  gl.drawArrays(gl.POINTS, 0, galaxyData.count);

  /* ---- 暗尘带：反向减法，只减不增 ---- */
  if (dustBuffers) {
    gl.blendEquation(gl.FUNC_REVERSE_SUBTRACT);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
    gl.uniform1f(P.uniforms.uOpacity, alpha * 0.055);

    bindAttrib(P, 'aPos',   dustBuffers.pos, 3);
    bindAttrib(P, 'aColor', dustBuffers.col, 3);
    bindAttrib(P, 'aSize',  dustBuffers.siz, 1);
    bindAttrib(P, 'aSeed',  dustBuffers.sed, 1);

    gl.drawArrays(gl.POINTS, 0, dustData.count);

    gl.blendEquation(gl.FUNC_ADD);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  }

  /* ---- 光晕（沿用调用方的加法混合） ---- */
  var B = progBillboard;
  gl.useProgram(B.program);
  gl.uniformMatrix4fv(B.uniforms.uProj, false, projMat);
  gl.uniformMatrix4fv(B.uniforms.uView, false, viewMat);
  bindAttrib(B, 'aQuad', quadBuffer, 2);

  // 银心：不随星系自转
  for (var i = 0; i < GLOWS.length; i++) {
    var g = GLOWS[i];
    gl.uniform3f(B.uniforms.uCenter, 0, 0, 0);
    gl.uniform1f(B.uniforms.uSize, g.size);
    gl.uniform3fv(B.uniforms.uColor, g.color);
    gl.uniform1f(B.uniforms.uOpacity, g.alpha * alpha);
    gl.drawArrays(gl.TRIANGLES, 0, 6);
  }

  // 旋臂星团：手动变换，跟随星系自转
  var c = Math.cos(galaxySpin), s = Math.sin(galaxySpin);
  for (var k = 0; k < CLUSTER_SPECS.length; k++) {
    var cs = CLUSTER_SPECS[k];
    var wx = cs.pos[0] * c + cs.pos[2] * s;
    var wz = -cs.pos[0] * s + cs.pos[2] * c;
    gl.uniform3f(B.uniforms.uCenter, wx, cs.pos[1], wz);
    gl.uniform1f(B.uniforms.uSize, cs.size);
    gl.uniform3fv(B.uniforms.uColor, cs.color);
    gl.uniform1f(B.uniforms.uOpacity, cs.alpha * alpha);
    gl.drawArrays(gl.TRIANGLES, 0, 6);
  }

  // 太阳系位置的脉冲标记：让用户一眼看到该点哪里
  var pulse = 0.55 + 0.45 * Math.sin(time * 2.2);
  gl.uniform3f(B.uniforms.uCenter,
               SUN_MARKER_WORLD[0], SUN_MARKER_WORLD[1], SUN_MARKER_WORLD[2]);
  gl.uniform1f(B.uniforms.uSize, 22 + pulse * 16);
  gl.uniform3f(B.uniforms.uColor, 0.30, 0.82, 1.00);
  gl.uniform1f(B.uniforms.uOpacity, (0.35 + pulse * 0.45) * alpha);
  gl.drawArrays(gl.TRIANGLES, 0, 6);

  gl.uniform1f(B.uniforms.uSize, 60 + pulse * 40);
  gl.uniform1f(B.uniforms.uOpacity, (0.10 + pulse * 0.16) * alpha);
  gl.drawArrays(gl.TRIANGLES, 0, 6);
}

/* ---- 19.3 单个天体 ---- */
function drawBody(mesh, alpha) {
  var B = progBody;
  gl.useProgram(B.program);

  gl.uniformMatrix4fv(B.uniforms.uProj, false, projMat);
  gl.uniformMatrix4fv(B.uniforms.uView, false, viewMat);
  gl.uniformMatrix4fv(B.uniforms.uModel, false, mesh.model);
  M4.normalMat3(mesh.model, mesh.normal);
  gl.uniformMatrix3fv(B.uniforms.uNormalMat, false, mesh.normal);
  gl.uniform3f(B.uniforms.uLightPos, 0, 0, 0);
  gl.uniform3fv(B.uniforms.uCamPos, cam.eye);
  gl.uniform1f(B.uniforms.uOpacity, alpha);
  gl.uniform1f(B.uniforms.uHasTex, 1);
  gl.uniform1f(B.uniforms.uEmissive, mesh.emissive ? 1 : 0);

  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, mesh.tex);
  gl.uniform1i(B.uniforms.uTex, 0);

  bindAttrib(B, 'aPos', mesh.posBuf, 3);
  bindAttrib(B, 'aNor', mesh.norBuf, 3);
  bindAttrib(B, 'aUv',  mesh.uvBuf, 2);

  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mesh.idxBuf);
  gl.drawElements(gl.TRIANGLES, mesh.idxCount, gl.UNSIGNED_SHORT, 0);
}

function drawRing(ring, alpha) {
  var R = progRing;
  gl.useProgram(R.program);

  gl.uniformMatrix4fv(R.uniforms.uProj, false, projMat);
  gl.uniformMatrix4fv(R.uniforms.uView, false, viewMat);
  gl.uniformMatrix4fv(R.uniforms.uModel, false, ring.model);
  gl.uniform3fv(R.uniforms.uColorA, ring.colorA);
  gl.uniform3fv(R.uniforms.uColorB, ring.colorB);
  gl.uniform1f(R.uniforms.uOpacity, ring.opacity * alpha);

  bindAttrib(R, 'aPos', ring.posBuf, 3);
  bindAttrib(R, 'aR',   ring.rBuf, 1);

  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ring.idxBuf);
  gl.drawElements(gl.TRIANGLES, ring.idxCount, gl.UNSIGNED_SHORT, 0);
}

function drawOrbitLine(buf, count, alpha, highlight) {
  var L = progLine;
  gl.useProgram(L.program);

  gl.uniformMatrix4fv(L.uniforms.uProj, false, projMat);
  gl.uniformMatrix4fv(L.uniforms.uView, false, viewMat);
  gl.uniform3f(L.uniforms.uColor,
               highlight ? 0.30 : 0.42,
               highlight ? 0.82 : 0.53,
               highlight ? 1.00 : 0.70);
  gl.uniform1f(L.uniforms.uOpacity, (highlight ? 0.85 : 0.22) * alpha);

  bindAttrib(L, 'aPos', buf, 3);
  gl.drawArrays(gl.LINE_STRIP, 0, count);
}

/**
 * 被选中行星外侧的一圈淡青光晕，帮助定位。
 * 必须在 drawBody 之前调用：光晕是一条半透明 billboard，不写深度，
 * 随后绘制的不透明球体会盖住它中间的部分，只留下贴边的一圈辉光。
 */
function drawBodyHighlight(body, alpha) {
  var B = progBillboard;
  gl.useProgram(B.program);
  gl.uniformMatrix4fv(B.uniforms.uProj, false, projMat);
  gl.uniformMatrix4fv(B.uniforms.uView, false, viewMat);
  bindAttrib(B, 'aQuad', quadBuffer, 2);

  var pulse = 0.7 + 0.3 * Math.sin(simTime * 3.0);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  gl.depthMask(false);
  gl.uniform3f(B.uniforms.uCenter, body.worldPos[0], body.worldPos[1], body.worldPos[2]);
  gl.uniform1f(B.uniforms.uSize, body.mesh.radius * (2.2 + pulse * 0.5));
  gl.uniform3f(B.uniforms.uColor, 0.30, 0.82, 1.00);
  gl.uniform1f(B.uniforms.uOpacity, 0.35 * alpha);
  gl.drawArrays(gl.TRIANGLES, 0, 6);
  gl.depthMask(true);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
}

/* ---- 19.4 太阳系层 ---- */
function drawSolarLayer(alpha) {
  if (alpha < 0.004 || !sunMesh) return;

  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(true);
  // 关键：银河层用的是加法混合，这里必须切回普通 alpha 混合
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

  // 太阳（自发光）
  buildBodyModel(sunMesh);
  drawBody(sunMesh, alpha);

  // 行星
  for (var j = 0; j < solarBodies.length; j++) {
    var b = solarBodies[j];
    if (b.highlight) drawBodyHighlight(b, alpha);
    buildBodyModel(b.mesh);
    drawBody(b.mesh, alpha);
  }

  // 环：半透明，不写深度
  gl.depthMask(false);
  for (var k = 0; k < solarBodies.length; k++) {
    var bb = solarBodies[k];
    if (!bb.ring) continue;
    buildRingModel(bb);
    drawRing(bb.ring, alpha);
  }

  // 轨道线
  if (orbitsVisible) {
    for (var m = 0; m < solarBodies.length; m++) {
      drawOrbitLine(solarBodies[m].lineBuf, solarBodies[m].lineCount,
                    alpha, solarBodies[m].highlight);
    }
  }

  // 太阳光晕：加法混合。
  // 关闭深度测试是有意为之——光晕平面位于球心深度，若参与深度测试
  // 就会被太阳球体自身的前表面整片剔除，从而完全看不见。
  gl.disable(gl.DEPTH_TEST);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  var B = progBillboard;
  gl.useProgram(B.program);
  gl.uniformMatrix4fv(B.uniforms.uProj, false, projMat);
  gl.uniformMatrix4fv(B.uniforms.uView, false, viewMat);
  bindAttrib(B, 'aQuad', quadBuffer, 2);

  var glows = [
    { size: 15, color: [1.00, 0.97, 0.88], alpha: 0.95 },
    { size: 30, color: [1.00, 0.83, 0.52], alpha: 0.45 },
    { size: 54, color: [1.00, 0.58, 0.24], alpha: 0.18 }
  ];
  for (var n = 0; n < glows.length; n++) {
    gl.uniform3f(B.uniforms.uCenter, 0, 0, 0);
    gl.uniform1f(B.uniforms.uSize, glows[n].size);
    gl.uniform3fv(B.uniforms.uColor, glows[n].color);
    gl.uniform1f(B.uniforms.uOpacity, glows[n].alpha * alpha);
    gl.drawArrays(gl.TRIANGLES, 0, 6);
  }

  gl.enable(gl.DEPTH_TEST);
  gl.disable(gl.BLEND);
  gl.depthMask(true);
}

function buildBodyModel(mesh) {
  var m = mesh.model;
  M4.identity(m);
  M4.translate(m, mesh.worldPos[0], mesh.worldPos[1], mesh.worldPos[2]);
  M4.rotateZ(m, mesh.tiltRad);
  M4.rotateY(m, mesh.spin);
  M4.scale(m, mesh.radius);
  return m;
}

/** 环与行星同位同倾，但自身不参与自转 */
function buildRingModel(body) {
  var m = body.ring.model;
  M4.identity(m);
  M4.translate(m, body.worldPos[0], body.worldPos[1], body.worldPos[2]);
  M4.rotateZ(m, body.mesh.tiltRad);
  return m;
}

/* ---- 19.5 动画更新 ---- */

function updateGalaxy(dt) {
  if (!paused) {
    galaxySpin += dt * timeScale * (Math.PI * 2 / CFG.galaxy.spinPeriod);
    if (galaxySpin > Math.PI * 2) galaxySpin -= Math.PI * 2;
  }

  M4.identity(galaxyModel);
  M4.rotateY(galaxyModel, galaxySpin);

  // 标记的世界坐标跟随星系自转
  var c = Math.cos(galaxySpin), s = Math.sin(galaxySpin);
  var lx = SUN_MARKER_LOCAL[0], lz = SUN_MARKER_LOCAL[2];
  SUN_MARKER_WORLD[0] = lx * c + lz * s;
  SUN_MARKER_WORLD[1] = SUN_MARKER_LOCAL[1];
  SUN_MARKER_WORLD[2] = -lx * s + lz * c;
}

function updateSolar(dt) {
  if (!paused) {
    var st = dt * timeScale;

    for (var i = 0; i < solarBodies.length; i++) {
      var b = solarBodies[i];

      b.angle += st * b.angSpeed;
      // 100× 速度下卡顿时单帧增量可能超过一整圈，用 while 保证真正归一
      var TAU = Math.PI * 2;
      while (b.angle >= TAU) b.angle -= TAU;
      while (b.angle < 0) b.angle += TAU;

      var ox = Math.cos(b.angle) * b.orbitR;
      var oz = Math.sin(b.angle) * b.orbitR;
      var sinT = Math.sin(b.orbitTilt);
      var cosT = Math.cos(b.orbitTilt);

      b.worldPos[0] = ox;
      b.worldPos[1] = oz * sinT;
      b.worldPos[2] = oz * cosT;
      b.mesh.worldPos = b.worldPos;

      var dir = b.mesh.retro ? -1 : 1;
      b.mesh.spin += st * b.mesh.spinSpeed * dir;
      if (b.mesh.spin > Math.PI * 2) b.mesh.spin -= Math.PI * 2;
      if (b.mesh.spin < 0) b.mesh.spin += Math.PI * 2;
    }

    sunMesh.spin += st * sunMesh.spinSpeed;
    if (sunMesh.spin > Math.PI * 2) sunMesh.spin -= Math.PI * 2;
  }

  // 补间期间让终点跟随公转中的行星，避免相机飞到旧位置
  if (camTween.active && camTween.followId) {
    var fb = findBodyById(camTween.followId);
    if (fb) {
      camTween.to.target[0] = fb.worldPos[0];
      camTween.to.target[1] = fb.worldPos[1];
      camTween.to.target[2] = fb.worldPos[2];
    }
  }

  // 聚焦状态下持续跟随
  if (!camTween.active && state === ST.FOCUS && focusedId) {
    if (focusedId === 'sun') {
      cam.tTarget[0] = 0; cam.tTarget[1] = 0; cam.tTarget[2] = 0;
    } else {
      var target = findBodyById(focusedId);
      if (target) {
        cam.tTarget[0] = target.worldPos[0];
        cam.tTarget[1] = target.worldPos[1];
        cam.tTarget[2] = target.worldPos[2];
      }
    }
  }
}

function updateLayers(dt) {
  var k = 1 - Math.exp(-dt * 3.6);
  layerAlpha.galaxy += (layerTarget.galaxy - layerAlpha.galaxy) * k;
  layerAlpha.solar  += (layerTarget.solar  - layerAlpha.solar)  * k;

  if (layerAlpha.galaxy < 0.004) layerAlpha.galaxy = 0;
  if (layerAlpha.solar  < 0.004) layerAlpha.solar  = 0;
}

/* ---- 19.6 主循环 ---- */

var lastTs = 0;
var bootHidden = false;

function frame(ts) {
  requestAnimationFrame(frame);

  if (!lastTs) lastTs = ts;
  var dt = Math.min((ts - lastTs) / 1000, 0.1);
  lastTs = ts;
  simTime += dt;

  updateGalaxy(dt);
  updateSolar(dt);      // 先更新天体位置，相机补间才能取到最新目标
  updateCamera(dt);
  updateLayers(dt);

  // 视图矩阵：接近极点时换「上」向量，避免方向翻转
  var up = (cam.phi < 0.12 || cam.phi > Math.PI - 0.12) ? UP_Z : UP_Y;
  M4.lookAt(viewMat, cam.eye, cam.target, up);

  // 清屏（清深度前必须打开深度写入，否则深度缓冲不会被清掉）
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.depthMask(true);
  gl.clearColor(0.0, 0.008, 0.031, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  // 1) 背景星
  gl.disable(gl.DEPTH_TEST);
  gl.depthMask(false);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  drawBackgroundStars(simTime);

  // 2) 银河
  if (layerAlpha.galaxy > 0) drawGalaxyLayer(simTime);

  // 3) 太阳系（内部会自己设置深度与混合状态）
  if (layerAlpha.solar > 0) drawSolarLayer(layerAlpha.solar);

  gl.disable(gl.BLEND);

  updatePickables(viewMat, projMat);
  updateLabels(viewMat, projMat);

  if (!bootHidden) {
    bootHidden = true;
    hideBoot();
  }
}

/* ==========================================================================
 *  20.  启动
 * ========================================================================== */

function setBootProgress(p) {
  document.getElementById('bootBar').style.width = p + '%';
}

function hideBoot() {
  var boot = document.getElementById('boot');
  boot.classList.add('gone');
  setTimeout(function () { boot.style.display = 'none'; }, 520);
}

/** 分两步构建，让浏览器有机会刷新加载进度 */
function initSceneStep1() {
  galaxyData = buildGalaxyParticles();
  galaxyBuffers = {
    pos: createBuffer(gl.ARRAY_BUFFER, galaxyData.pos),
    col: createBuffer(gl.ARRAY_BUFFER, galaxyData.col),
    siz: createBuffer(gl.ARRAY_BUFFER, galaxyData.siz),
    sed: createBuffer(gl.ARRAY_BUFFER, galaxyData.sed)
  };

  dustData = buildDustLanes();
  dustBuffers = {
    pos: createBuffer(gl.ARRAY_BUFFER, dustData.pos),
    col: createBuffer(gl.ARRAY_BUFFER, dustData.col),
    siz: createBuffer(gl.ARRAY_BUFFER, dustData.siz),
    sed: createBuffer(gl.ARRAY_BUFFER, dustData.sed)
  };

  bgData = buildBackgroundStars();
  bgBuffers = {
    pos: createBuffer(gl.ARRAY_BUFFER, bgData.pos),
    col: createBuffer(gl.ARRAY_BUFFER, bgData.col),
    siz: createBuffer(gl.ARRAY_BUFFER, bgData.siz),
    sed: createBuffer(gl.ARRAY_BUFFER, bgData.sed)
  };

  setBootProgress(46);

  // 盘面纹理要逐像素算 fBm，是启动阶段最重的一步，所以拆成分片异步生成，
  // 让进度条一路上走到 78%。
  buildGalaxyTexture(function () {
    setTimeout(function () {
      buildSolarSystem();
      buildLabels();
      setBootProgress(100);

      setTimeout(function () {
        setUIMode('galaxy');
        computeEye();
        requestAnimationFrame(frame);
      }, 40);
    }, 40);
  });
}

function start() {
  resize();
  setBootProgress(10);

  // 先让加载层绘制出来，再做耗时的粒子与纹理生成
  setTimeout(initSceneStep1, 50);

  setTimeout(function () {
    showToast('拖动旋转 · 滚轮缩放 · 点击蓝色脉冲点进入太阳系', 3400);
  }, 1600);
}

canvas.addEventListener('webglcontextlost', function (e) {
  e.preventDefault();
  var fail = document.getElementById('fail');
  fail.textContent = 'WebGL 上下文丢失（可能是显卡驱动重置）。请刷新页面重试。';
  fail.style.display = 'flex';
});

start();

})();
</script>
</body>
